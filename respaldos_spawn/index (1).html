function tone(f,d,ty,v,t0,f2){const a=au();if(!a)return;const t=a.currentTime+(t0||0),o=a.createOscillator(),gn=a.createGain();o.type=ty||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);gn.gain.setValueAtTime(v||.2,t);gn.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(gn);gn.connect(a.destination);o.start(t);o.stop(t+d+.02)}

  if(s==='p'){if(u.rdy&&u.m!=='g')setSu(i)}
  else if(su!=null){upd(n=>attack(n,'p',su,i));setSu(null)}};
 const face=()=>{if(mine&&g.ph==='combat'&&su!=null&&!guarded(g.e)){upd(n=>attack(n,'p',su,-1));setSu(null)}};
 const Row=s=>{const S=g[s];return html`<div className="row fld">
  <div className="pile"><span>MAZO</span><b>${S.deck.length}</b></div>
  <div className="pile"><span>PILA KO</span><b>${S.ko.length}</b><span>${S.ko.length?D[S.ko[S.ko.length-1]].n:'vacía'}</span></div>
  <div className=${'slot trapslot'+(an[s+'trap']||'')} title=${s==='p'&&S.trap?'Tu carta oculta: '+D[S.trap].n:'Ranura de carta oculta'}><span className="lbl">OCULTA</span>${S.trap?html`<div className="card back" onPointerEnter=${()=>s==='p'&&setZm({id:S.trap})}></div>`:null}${FL(s,'trap')}</div>
  ${S.f.map((u,i)=>{let gl='';
   if(hid){const c=D[hid];if(c.t==='c'&&s==='p'&&(!u||(hid==='spawn'&&u.id==='alsimmons')))gl='glow';else if((hid==='cia'||hid==='biggun')&&s==='p'&&tl.includes(i))gl='glow';else if((hid==='fire'||hid==='stasis')&&s==='e'&&tl.includes(i))gl='glow'}
   if(mine&&g.ph==='combat'){if(s==='p'&&u&&u.rdy&&u.m!=='g')gl='rdyc';if(s==='e'&&u&&su!=null)gl='glow';if(s==='p'&&su===i)gl='sel'}
   return html`<div key=${i} className=${'slot '+gl+(an[s+i]||'')} onClick=${()=>clickSlot(s,i)}>${u?html`<${Card} id=${u.id} u=${u} onPointerEnter=${()=>setZm({id:u.id,u})}/>`:null}${u&&s==='p'&&mine&&!u.tg?html`<button className="mbtn" onClick=${e=>{e.stopPropagation();upd(n=>toggle(n,'p',i));if(su===i)setSu(null)}}>${u.m==='g'?'⚔️ ATAQUE':'🛡️ GUARDIA'}</button>`:null}${FL(s,i)}</div>`})}</div>`};
 const Hp=s=>{const hp=Math.max(0,g[s].hp),can=s==='e'&&mine&&g.ph==='combat'&&su!=null&&!guarded(g.e);
  return html`<div className=${'hp '+(can?'glow':'')+(an[s+'hp']||'')} onClick=${s==='e'?face:null}><b>${s==='e'?BOSSES[g.boss].n:'TÚ'}</b><div className="bar"><div style=${{width:hp/g[s].mhp*100+'%'}}></div></div><b>♥ ${hp}</b>${FL(s,'hp')}</div>`};
 const en=g.turn==='p'?g.m:-g.m;
 const needsT=hid&&tl!==null;
 const hint=g.over?'Partida terminada.':g.turn==='e'?'Turno del rival…':g.ph==='main'?(hid?(needsT?'Elige un objetivo resaltado.':'Pulsa JUGAR o elige una zona vacía.'):'Elige una carta de tu mano.'):(su==null?'Elige un personaje con ⚔ y luego su objetivo. Si el rival no tiene personajes en Guardia 🛡️, puedes atacar su HP.':'Elige el objetivo enemigo.');
 return html`<${React.Fragment}><div className="top"><h1>SPAWN TCG</h1><button onClick=${()=>{SND=!SND;try{localStorage.setItem('spawnTcgSnd',SND?'1':'0')}catch(e){}setSnd(SND);sfx('place')}}>${snd?'🔊 SONIDO ON':'🔇 SONIDO OFF'}</button></div><div className="app">
 <div className="side"><div className="pan">
  <div className="zoom">${zm?html`<${Card} id=${zm.id} u=${zm.u}/>`:null}</div>
  ${zm?html`<div className="fx"><b>${D[zm.id].n}</b> <small>#${D[zm.id].number} · ${D[zm.id].f}</small><p>${D[zm.id].x}</p></div>`:html`<p style=${{color:'#8a9a9e'}}>Pasa el ratón (o toca) una carta para verla en grande.</p>`}
  <h2>HISTORIAL</h2><div className="log">${g.log.map((t,i)=>html`<div key=${i}>${t}</div>`)}</div></div></div>
 <div className="main">
  ${Hp('e')}
  <div className="row">${g.e.hand.map((_,i)=>html`<div key=${i} className="card back" style=${{'--cw':'38px'}}></div>`)}</div>
  ${Row('e')}
  <div className="ml"><span>◀ RIVAL (-10)</span><b style=${{color:'#39ff14'}}>Necroplasma de ${g.turn==='p'?'tu':'su'} turno: ${Math.max(0,en)}</b><span>TÚ (+10) ▶</span></div>
  <div className="meter">${Array.from({length:21},(_,k)=>{const v=k-10;return html`<i key=${k} className=${v===g.m?'on':v<0?'n':v>0?'p':''}>${v===g.m?v:''}</i>`})}</div>
  ${Row('p')}
  <div className="ctl">
   <div className="hint">${hint}</div>
   ${hid&&!needsT&&can(g,'p',hid)?html`<button onClick=${()=>doPlay(sh,D[hid].t==='c'?{slot:g.p.f.indexOf(null)>=0?g.p.f.indexOf(null):g.p.f.findIndex(u=>u&&u.id==='alsimmons')}:{})}>JUGAR</button>`:null}
   ${hid&&D[hid].t==='e'&&!g.p.trap?html`<button onClick=${()=>{upd(n=>setTrap(n,'p',sh));setSh(null)}}>COLOCAR OCULTA (1)</button>`:null}
   ${mine&&g.mull&&g.ph==='main'?html`<button className="red" onClick=${()=>{upd(n=>mulligan(n));setSh(null);setZm(null)}}>Cambiar Mano (Mulligan)</button>`:null}
   <button disabled=${!mine||g.ph!=='main'} onClick=${()=>{upd(n=>{n.ph='combat';L(n,'Fase de combate.')});setSh(null)}}>IR A COMBATE</button>
   <button disabled=${!mine} onClick=${()=>{if(g.p.hand.length>7)setDc(true);else upd(n=>{L(n,'Terminas tu turno.');endTurn(n,'p',3)})}}>TERMINAR TURNO</button>
   <button onClick=${()=>setMg(true)}>CARGAR IMÁGENES / MAZOS</button><button className="red" onClick=${reset}>NUEVA PARTIDA</button></div>
  <div className="row hand">${g.p.hand.map((id,i)=>html`<${Card} key=${i} id=${id} cls=${(sh===i?'sel ':'')+(can(g,'p',id)?'':'dim')} onClick=${()=>{setZm({id});if(mine&&g.ph==='main')setSh(sh===i?null:i)}} onPointerEnter=${()=>setZm({id})}/>`)}</div>
  ${Hp('p')}
 </div>
 ${dc&&g.p.hand.length>7?html`<div className="ov"><div className="mgr"><h2>LÍMITE DE MANO: 7</h2><p>Descarta ${g.p.hand.length-7} carta(s) a la Pila de KO:</p><div className="row">${g.p.hand.map((id,i)=>html`<${Card} key=${i} id=${id} onClick=${()=>{upd(n=>{const d=n.p.hand.splice(i,1)[0];n.p.ko.push(d);E(n,{k:'snd',n:'discard'});L(n,'Descartas '+D[d].n+' por límite de mano.');if(n.p.hand.length<=7){L(n,'Terminas tu turno.');endTurn(n,'p',3)}});if(g.p.hand.length-1<=7)setDc(false)}} onPointerEnter=${()=>setZm({id})}/>`)}</div><div className="ctl"><button className="red" onClick=${()=>setDc(false)}>Cancelar</button></div></div></div>`:null}
 ${ch?html`<div className="ov"><div><h2>C.I.A. Contact</h2><p>Elige la mejora:</p><div className="ctl" style=${{justifyContent:'center'}}>
  <button onClick=${()=>doPlay(sh,{tg:ch.tg,md:'atk'})}>+3 ATK</button><button onClick=${()=>doPlay(sh,{tg:ch.tg,md:'hp'})}>+4 HP</button><button className="red" onClick=${()=>setCh(null)}>Cancelar</button></div></div></div>`:null}
 ${pick?html`<div className="ov"><div className="mgr"><h1>ELIGE RIVAL</h1><div className="bosses">${Object.entries(BOSSES).map(([k,b])=>html`<button key=${k} className="boss" onClick=${()=>start(k)}><div className="bi">${b.i}</div><b>${b.n}</b><small>♥ ${b.hp} HP</small><p>${b.d}</p></button>`)}</div><div className="ctl"><button onClick=${()=>setMg(true)}>CARGAR IMÁGENES / MAZOS</button></div></div></div>`:null}
 ${mg?html`<${Manager} onClose=${()=>setMg(false)} onSave=${()=>setVer(v=>v+1)} onStart=${()=>{setMg(false);start(g.boss)}}/>`:null}
 ${g.over?html`<div className="ov"><div><h1>${g.over==='p'?'VICTORIA':'DERROTA'}</h1><p>${g.over==='p'?'El Infierno se queda sin campeón.':'El rival te deja sin HP.'}</p><button onClick=${reset}>NUEVA PARTIDA</button></div></div>`:null}
 </div></${React.Fragment}>`}
ReactDOM.createRoot(document.getElementById('r')).render(html`<${App}/>`);
</script></body></html>
