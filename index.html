<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SPAWN TCG: Necroplasma</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--g:#39ff14;--r:#c1121f;--m:#8a9a9e;--tx:#e8efe9;--cw:clamp(58px,8.2vw,96px);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#10230f,#06080a 62%);color:var(--tx);font:13px/1.35 system-ui,sans-serif;min-height:100vh}
.app{max-width:1180px;margin:0 auto;padding:8px;display:grid;grid-template-columns:236px 1fr;gap:10px}
@media(max-width:820px){.app{grid-template-columns:1fr}.side{order:2}}
.pan{background:#0f1512;border:1px solid #2a3a30;border-radius:8px;padding:8px}
h1{font:400 32px Bangers,Impact,sans-serif;letter-spacing:2px;margin:0 0 6px;color:var(--g);text-shadow:2px 2px 0 var(--r)}
h2{font:400 16px Bangers,Impact,sans-serif;letter-spacing:1px;margin:8px 0 4px;color:#b8c2c6}
.row{display:flex;gap:6px;align-items:center;justify-content:center;overflow-x:auto;padding:5px 3px}
.slot{width:calc(var(--cw) + 4px);height:calc(var(--cw)*1.42 + 4px);border:2px dashed #34423a;border-radius:7px;flex:none}
.slot.glow{border-color:var(--g);box-shadow:0 0 12px 2px var(--g)}
.slot.rdyc{border:2px solid var(--r);box-shadow:0 0 12px 2px var(--r)}
.slot.sel{border:2px solid #fff;box-shadow:0 0 12px 2px #fff}
.pile{width:calc(var(--cw)*.8);height:calc(var(--cw)*1.42);flex:none;border:2px solid #5b676b;border-radius:6px;background:linear-gradient(#222b29,#0b0f0e);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:10px;color:var(--m);padding:2px}
.pile b{font-size:20px;color:var(--tx)}
.card{position:relative;width:var(--cw);height:calc(var(--cw)*1.42);border:2px solid #b8c2c6;border-radius:6px;background:linear-gradient(160deg,#1d2723,#090c0b);display:flex;flex-direction:column;padding:3px 3px 2px;font-size:calc(var(--cw)*.1);line-height:1.15;flex:none;cursor:pointer;transition:transform .12s}
.card.m{border-color:var(--g)}.card.e{border-color:#ff3b3b}
.cost{position:absolute;left:-6px;top:-6px;width:calc(var(--cw)*.28);height:calc(var(--cw)*.28);border-radius:50%;background:var(--g);color:#000;font:700 calc(var(--cw)*.17) system-ui;display:grid;place-items:center;border:2px solid #000;z-index:2}
.nm{font-weight:700;text-align:center;padding-left:calc(var(--cw)*.14);min-height:2.3em;overflow:hidden}
.art{flex:1;display:grid;place-items:center;font-size:calc(var(--cw)*.4);background:radial-gradient(circle,#1b4a16,#0a0d0b);border:1px solid #2c3b33;border-radius:3px;margin:2px 0}
.fc{text-align:center;color:var(--m);font-size:.8em}
.tx{display:none;padding:3px;min-height:4.4em}
.zoom{--cw:190px;display:flex;justify-content:center}
.zoom .tx{display:block}
.st{display:flex;justify-content:space-between;font-weight:700}
.a{color:#ff6b5e}.h{color:#6dff5a}
.bd{position:absolute;right:2px;top:2px;font-size:1.3em}
.back{background:repeating-linear-gradient(45deg,#1a0709,#1a0709 6px,#2a0b0e 6px,#2a0b0e 12px);border-color:var(--r);cursor:default}
.hand .card:hover{transform:translateY(-8px)}
.card.sel{transform:translateY(-12px);box-shadow:0 0 14px 3px #fff}
.card.dim{opacity:.55}
.meter{display:flex;gap:2px;margin:4px 0}
.meter i{flex:1;height:22px;border-radius:3px;background:#1a211e;font:10px/22px system-ui;text-align:center;color:#6a7a70;font-style:normal}
.meter .n{background:#2a0b0e}.meter .p{background:#0f2a12}
.meter .on{background:var(--g);color:#000;font-weight:700;box-shadow:0 0 10px var(--g)}
.ml{display:flex;justify-content:space-between;font-size:11px;color:var(--m)}
.hp{display:flex;align-items:center;gap:8px;padding:4px 8px;border:1px solid #2a3a30;border-radius:6px;background:#0b100e}
.hp.glow{border-color:var(--g);box-shadow:0 0 10px var(--g);cursor:pointer}
.bar{flex:1;height:10px;background:#2a0b0e;border-radius:5px;overflow:hidden}.bar div{height:100%;background:var(--r);transition:width .3s}
.ctl{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0}
button{font:700 13px system-ui;background:#1d2723;color:var(--tx);border:1px solid var(--g);border-radius:5px;padding:7px 11px;cursor:pointer}
button:focus-visible{outline:2px solid #fff}button:disabled{opacity:.4;cursor:default}button.red{border-color:var(--r)}
.hint{color:#b8c2c6;font-size:12px;flex:1;min-width:150px}
.log{max-height:210px;overflow:auto;font-size:12px}.log div{border-bottom:1px solid #1d2a22;padding:2px 0}
.ov{position:fixed;inset:0;background:#000c;display:grid;place-items:center;z-index:9}
.ov>div{background:#0f1512;border:2px solid var(--g);border-radius:10px;padding:20px;text-align:center;max-width:320px}
.ov h1{font-size:42px}
</style></head>
<body><div id="r"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script>
const {useState,useEffect}=React;
const html=htm.bind(React.createElement);
const D={
spawn:{n:'Spawn (Al Simmons)',t:'c',c:4,a:6,h:7,i:'💀',f:'Hellspawn',d:1,x:'Al entrar, si tu Pila de KO tiene cartas, gana +2 ATK.'},
medieval:{n:'Medieval Spawn',t:'c',c:5,a:7,h:8,i:'🛡️',f:'Infierno',d:1,x:'Escudo: reduce en 2 el primer daño que recibe cada turno.'},
violator:{n:'Violator',t:'c',c:4,a:7,h:5,i:'👹',f:'Infierno',d:1,x:'Prisa: puede atacar el mismo turno en que entra.'},
angela:{n:'Angela',t:'c',c:3,a:5,h:5,i:'🪽',f:'Cielo',x:'Al atacar a un demonio o personaje de coste 4+, gana +2 ATK en ese combate.'},
cogliostro:{n:'Cogliostro',t:'c',c:2,a:2,h:4,i:'🧙',f:'Inmortal',x:'Al entrar: +1 Necroplasma y robas 1 carta.'},
cia:{n:'C.I.A. Contact',t:'m',c:2,i:'🕶️',f:'C.I.A.',x:'Equipa a un personaje propio: elige +3 ATK o +4 HP.'},
fire:{n:'Elemental Fire',t:'e',c:3,i:'🔥',f:'Evento',x:'5 de daño a un personaje enemigo (no afecta a Angela).'},
bums:{n:'Bums (Los Vagabundos)',t:'e',c:1,i:'🥫',f:'Evento',x:'Recupera la última carta de tu Pila de KO y ponla en tu mano.'},
blast:{n:'Necro-Blast',t:'e',c:2,i:'☢️',f:'Evento',x:'3 de daño directo al HP rival; pierdes 1 HP.'},
stasis:{n:'Stasis Field',t:'e',c:2,i:'❄️',f:'Evento',x:'Congela a un personaje enemigo: no puede atacar en su próximo turno.'}};
let UID=0;
const mk=id=>({u:++UID,id,atk:D[id].a,hp:D[id].h,mx:D[id].h,rdy:false,fz:false,sh:false});
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const mkSide=()=>({hp:20,deck:shuffle(Object.keys(D).flatMap(k=>[k,k])),hand:[],f:[null,null,null],ko:[]});
const opp=s=>s==='p'?'e':'p';
const nm=s=>s==='p'?'Tú':'Rival';
const L=(g,t)=>{g.log.unshift(t);if(g.log.length>60)g.log.length=60};
const clamp=v=>Math.max(-10,Math.min(10,v));
function draw(g,s){const S=g[s];if(!S.deck.length){S.hp--;L(g,nm(s)+': mazo vacío, -1 HP.');return}S.hand.push(S.deck.pop())}
function win(g){if(g.over)return;if(g.p.hp<=0)g.over='e';else if(g.e.hp<=0)g.over='p'}
function startTurn(g,s){g.turn=s;g.ph='main';g.ai='main';
 for(const x of['p','e'])g[x].f.forEach(u=>{if(u)u.sh=false});
 g[s].f.forEach(u=>{if(u)u.rdy=!u.fz});
 draw(g,s);L(g,`— Turno ${s==='p'?'tuyo':'del rival'} (Necroplasma: ${s==='p'?g.m:-g.m}) —`);win(g)}
function endTurn(g,s,en){g[s].f.forEach(u=>{if(u)u.fz=false});g.m=clamp(s==='p'?-en:en);startTurn(g,opp(s))}
function newGame(){const g={p:mkSide(),e:mkSide(),m:3,turn:'p',ph:'main',ai:'main',log:[],over:null};
 for(let i=0;i<4;i++){draw(g,'p');draw(g,'e')}L(g,'¡Empieza la partida! Tienes 3 de Necroplasma.');startTurn(g,'p');return g}
function hit(g,s,i,n){const u=g[s].f[i];if(!u)return;if(u.id==='medieval'&&!u.sh){u.sh=true;n=Math.max(0,n-2)}u.hp-=n}
function sweep(g){for(const s of['p','e'])g[s].f.forEach((u,i)=>{if(u&&u.hp<=0){g[s].ko.push(u.id);g[s].f[i]=null;L(g,`${D[u.id].n} (${nm(s)}) cae a la Pila de KO.`)}})}
function tg(g,s,id){const S=g[s],T=g[opp(s)],ix=(F,ok)=>F.map((u,i)=>u&&ok(u)?i:-1).filter(i=>i>=0);
 if(id==='cia')return ix(S.f,()=>1);
 if(id==='fire')return ix(T.f,u=>u.id!=='angela');
 if(id==='stasis')return ix(T.f,()=>1);
 return null}
function can(g,s,id){const t=tg(g,s,id);if(t)return t.length>0;if(D[id].t==='c')return g[s].f.includes(null);if(id==='bums')return g[s].ko.length>0;return true}
function play(g,s,hi,o){const S=g[s],T=g[opp(s)],id=S.hand[hi],c=D[id];if(!id)return;
 S.hand.splice(hi,1);g.m=clamp(g.m+(s==='p'?-c.c:c.c));
 L(g,`${nm(s)} juega ${c.n} (coste ${c.c}).`);
 if(c.t==='c'){const u=mk(id);if(id==='violator')u.rdy=true;
  if(id==='spawn'&&S.ko.length){u.atk+=2;L(g,'Spawn gana +2 ATK por la Pila de KO.')}
  S.f[o.slot]=u;
  if(id==='cogliostro'){g.m=clamp(g.m+(s==='p'?1:-1));draw(g,s);L(g,'Cogliostro: +1 Necroplasma y roba 1 carta.')}}
 else{
  if(id==='cia'){const u=S.f[o.tg];if(o.md==='atk')u.atk+=3;else{u.hp+=4;u.mx+=4}L(g,`${D[u.id].n} recibe ${o.md==='atk'?'+3 ATK':'+4 HP'}.`)}
  if(id==='fire'){const u=T.f[o.tg];hit(g,opp(s),o.tg,5);L(g,`Elemental Fire quema a ${D[u.id].n}.`)}
  if(id==='bums'&&S.ko.length){const k=S.ko.pop();S.hand.push(k);L(g,`Recupera ${D[k].n} de la Pila de KO.`)}
  if(id==='blast'){T.hp-=3;S.hp-=1;L(g,`Necro-Blast: -3 HP al rival y -1 HP propio (${nm(s)}).`)}
  if(id==='stasis'){T.f[o.tg].fz=true;L(g,`${D[T.f[o.tg].id].n} queda congelado.`)}
  S.ko.push(id)}
 sweep(g);win(g);
 if(!g.over&&((s==='p'&&g.m<0)||(s==='e'&&g.m>0))){L(g,`${nm(s)} cruza el medidor: el turno termina.`);endTurn(g,s,Math.abs(g.m))}}
function attack(g,s,ai,ti){const S=g[s],o=opp(s),T=g[o],a=S.f[ai];if(!a||!a.rdy)return;
 if(ti<0){if(T.f.some(Boolean))return;a.rdy=false;T.hp-=a.atk;L(g,`${D[a.id].n} (${nm(s)}) ataca directo: -${a.atk} HP.`)}
 else{const t=T.f[ti];if(!t)return;a.rdy=false;const d=D[t.id];let av=a.atk;if(a.id==='angela'&&(d.d||d.c>=4))av+=2;
  hit(g,o,ti,av);hit(g,s,ai,t.atk);L(g,`${D[a.id].n} (${nm(s)}) ataca a ${d.n}: ${av} de daño, recibe ${t.atk}.`)}
 sweep(g);win(g)}
function aiOpts(g,s,id){const S=g[s],T=g[opp(s)],t=tg(g,s,id);
 if(D[id].t==='c')return{slot:S.f.indexOf(null)};
 if(id==='cia'){const i=t.sort((a,b)=>S.f[b].atk-S.f[a].atk)[0];return{tg:i,md:S.f[i].hp>=5?'atk':'hp'}}
 const sc=i=>(id==='fire'&&T.f[i].hp<=5?100:0)+T.f[i].atk;
 if(t)return{tg:t.sort((a,b)=>sc(b)-sc(a))[0]};
 return{}}
function aiStep(g){const s='e',S=g.e,P=g.p,en=-g.m;
 if(g.ai==='main'){let best=-1,bs=0;
  S.hand.forEach((id,i)=>{const c=D[id];if(c.c>en||!can(g,s,id))return;let sc=c.c*2;
   if(id==='blast')sc=(P.hp<=3||(S.hp>8&&!P.f.some(Boolean)))?20:0;
   if(id==='fire')sc=tg(g,s,id).some(k=>P.f[k].hp<=5)?14:6;
   if(id==='stasis')sc=P.f.some(u=>u&&u.atk>=6)?9:2;
   if(id==='bums')sc=5;
   if(id==='cia')sc=7;
   if(c.t==='c'&&!S.f.some(Boolean))sc+=5;
   if(sc>bs){bs=sc;best=i}});
  if(best>=0){play(g,s,best,aiOpts(g,s,S.hand[best]));return}
  g.ai='combat';return}
 if(g.ai==='combat'){const ai=S.f.findIndex(u=>u&&u.rdy);if(ai<0){g.ai='final';return}
  const a=S.f[ai];
  if(!P.f.some(Boolean)){attack(g,s,ai,-1);return}
  let bi=-1,bsc=0;
  P.f.forEach((t,i)=>{if(!t)return;const d=D[t.id],av=a.atk+(a.id==='angela'&&(d.d||d.c>=4)?2:0);
   const k=av>=t.hp+(t.id==='medieval'&&!t.sh?2:0),sv=t.atk<a.hp;if(!k&&!sv)return;
   const sc=(k?3:0)+(sv?2:0)+d.c/10;if(sc>bsc){bsc=sc;bi=i}});
  if(bi<0){a.rdy=false;return}
  attack(g,s,ai,bi);return}
 const i=S.hand.findIndex(id=>D[id].t==='c'&&can(g,s,id)&&D[id].c>en);
 if(i>=0&&Math.random()<.5){play(g,s,i,aiOpts(g,s,S.hand[i]));return}
 L(g,'El rival pasa su turno.');endTurn(g,s,3)}

const Card=({id,u,cls='',...p})=>{const c=D[id],a=u?u.atk:c.a,h=u?u.hp:c.h;
 return html`<div className=${'card '+c.t+' '+cls} ...${p}>
 <div className="cost">${c.c}</div><div className="nm">${c.n}</div><div className="art">${c.i}</div><div className="fc">${c.f}</div><div className="tx">${c.x}</div>
 ${c.t==='c'?html`<div className="st"><b className="a">⚔ ${a}</b><b className="h">♥ ${h}</b></div>`:html`<div className="st"><i>${c.t==='m'?'MEJORA':'EVENTO'}</i></div>`}
 ${u?html`<div className="bd">${u.fz?'❄️':u.rdy?'⚔️':'💤'}</div>`:null}</div>`};

function App(){
 const [g,setG]=useState(()=>newGame());
 const [sh,setSh]=useState(null),[su,setSu]=useState(null),[ch,setCh]=useState(null),[zm,setZm]=useState(null);
 const upd=f=>setG(o=>{const n=structuredClone(o);f(n);return n});
 const mine=g.turn==='p'&&!g.over;
 useEffect(()=>{if(g.turn!=='e'||g.over)return;const t=setTimeout(()=>upd(aiStep),g.ai==='main'?900:700);return()=>clearTimeout(t)},[g]);
 useEffect(()=>{setSh(null);setSu(null)},[g.turn]);
 const reset=()=>{setG(newGame());setSh(null);setSu(null);setCh(null);setZm(null)};
 const hid=mine&&g.ph==='main'&&sh!=null?g.p.hand[sh]:null;
 const tl=hid?tg(g,'p',hid):null;
 const doPlay=(hi,o)=>{upd(n=>play(n,'p',hi,o));setSh(null);setCh(null)};
 const clickSlot=(s,i)=>{if(!mine)return;
  if(g.ph==='main'){if(!hid)return;const c=D[hid];
   if(c.t==='c'&&s==='p'&&!g.p.f[i])return doPlay(sh,{slot:i});
   if(hid==='cia'&&s==='p'&&tl.includes(i))return setCh({tg:i});
   if((hid==='fire'||hid==='stasis')&&s==='e'&&tl.includes(i))return doPlay(sh,{tg:i});return}
  const u=g[s].f[i];if(!u)return;
  if(s==='p'){if(u.rdy)setSu(i)}
  else if(su!=null){upd(n=>attack(n,'p',su,i));setSu(null)}};
 const face=()=>{if(mine&&g.ph==='combat'&&su!=null&&!g.e.f.some(Boolean)){upd(n=>attack(n,'p',su,-1));setSu(null)}};
 const Row=s=>{const S=g[s];return html`<div className="row">
  <div className="pile"><span>MAZO</span><b>${S.deck.length}</b></div>
  <div className="pile"><span>PILA KO</span><b>${S.ko.length}</b><span>${S.ko.length?D[S.ko[S.ko.length-1]].n:'vacía'}</span></div>
  ${S.f.map((u,i)=>{let gl='';
   if(hid){const c=D[hid];if(c.t==='c'&&s==='p'&&!u)gl='glow';else if(hid==='cia'&&s==='p'&&tl.includes(i))gl='glow';else if((hid==='fire'||hid==='stasis')&&s==='e'&&tl.includes(i))gl='glow'}
   if(mine&&g.ph==='combat'){if(s==='p'&&u&&u.rdy)gl='rdyc';if(s==='e'&&u&&su!=null)gl='glow';if(s==='p'&&su===i)gl='sel'}
   return html`<div key=${i} className=${'slot '+gl} onClick=${()=>clickSlot(s,i)}>${u?html`<${Card} id=${u.id} u=${u} onPointerEnter=${()=>setZm({id:u.id,u})}/>`:null}</div>`})}</div>`};
 const Hp=s=>{const hp=Math.max(0,g[s].hp),can=s==='e'&&mine&&g.ph==='combat'&&su!=null&&!g.e.f.some(Boolean);
  return html`<div className=${'hp '+(can?'glow':'')} onClick=${s==='e'?face:null}><b>${s==='e'?'RIVAL':'TÚ'}</b><div className="bar"><div style=${{width:hp/20*100+'%'}}></div></div><b>♥ ${hp}</b></div>`};
 const en=g.turn==='p'?g.m:-g.m;
 const needsT=hid&&tl!==null;
 const hint=g.over?'Partida terminada.':g.turn==='e'?'Turno del rival…':g.ph==='main'?(hid?(needsT?'Elige un objetivo resaltado.':'Pulsa JUGAR o elige una zona vacía.'):'Elige una carta de tu mano.'):(su==null?'Elige un personaje con ⚔ y luego su objetivo. Con el campo rival vacío, ataca su HP.':'Elige el objetivo enemigo.');
 return html`<div className="app">
 <div className="side"><div className="pan"><h1>SPAWN TCG</h1>
  <div className="zoom">${zm?html`<${Card} id=${zm.id} u=${zm.u}/>`:html`<p style=${{color:'#8a9a9e'}}>Pasa el ratón (o toca) una carta para verla en grande.</p>`}</div>
  <h2>HISTORIAL</h2><div className="log">${g.log.map((t,i)=>html`<div key=${i}>${t}</div>`)}</div></div></div>
 <div className="main">
  ${Hp('e')}
  <div className="row">${g.e.hand.map((_,i)=>html`<div key=${i} className="card back" style=${{'--cw':'38px'}}></div>`)}</div>
  ${Row('e')}
  <div className="ml"><span>◀ RIVAL (-10)</span><b style=${{color:'#39ff14'}}>Necroplasma de ${g.turn==='p'?'tu':'su'} turno: ${Math.max(0,en)}</b><span>TÚ (+10) ▶</span></div>
  <div className="meter">${Array.from({length:21},(_,k)=>{const v=k-10;return html`<i key=${k} className=${v===g.m?'on':v<0?'n':v>0?'p':''}>${v===g.m?v:''}</i>`})}</div>
  ${Row('p')}
  <div className="ctl">
   <div className="hint">${hint}</div>
   ${hid&&!needsT&&can(g,'p',hid)?html`<button onClick=${()=>doPlay(sh,D[hid].t==='c'?{slot:g.p.f.indexOf(null)}:{})}>JUGAR</button>`:null}
   <button disabled=${!mine||g.ph!=='main'} onClick=${()=>{upd(n=>{n.ph='combat';L(n,'Fase de combate.')});setSh(null)}}>IR A COMBATE</button>
   <button disabled=${!mine} onClick=${()=>upd(n=>{L(n,'Terminas tu turno.');endTurn(n,'p',3)})}>TERMINAR TURNO</button>
   <button className="red" onClick=${reset}>NUEVA PARTIDA</button></div>
