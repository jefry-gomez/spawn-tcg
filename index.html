<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SPAWN TCG: Necroplasma</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--g:#39ff14;--r:#c1121f;--m:#8a9a9e;--tx:#e8efe9;--cw:clamp(66px,9vw,100px);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#10230f,#06080a 62%);color:var(--tx);font:13px/1.35 system-ui,sans-serif;min-height:100vh}
.app{max-width:1180px;margin:0 auto;padding:8px;display:grid;grid-template-columns:236px 1fr;gap:10px}
@media(max-width:820px){.app{grid-template-columns:1fr}.side{order:2}}
.pan{background:#0f1512;border:1px solid #2a3a30;border-radius:8px;padding:8px}
h1{font:400 32px Bangers,Impact,sans-serif;letter-spacing:2px;margin:0 0 6px;color:var(--g);text-shadow:2px 2px 0 var(--r)}
h2{font:400 16px Bangers,Impact,sans-serif;letter-spacing:1px;margin:8px 0 4px;color:#b8c2c6}
.row{display:flex;gap:6px;align-items:center;justify-content:center;overflow-x:auto;padding:5px 3px}
.slot{width:calc(var(--cw) + 4px);height:calc(var(--cw)*1.42 + 4px);border:2px dashed #34423a;border-radius:7px;flex:none}
.slot.glow{border-color:var(--g);box-shadow:0 0 12px 2px var(--g)}
.slot.rdyc{border:2px solid var(--r);box-shadow:0 0 12px 2px var(--r)}
.slot.sel{border:2px solid #fff;box-shadow:0 0 12px 2px #fff}
.pile{width:calc(var(--cw)*.8);height:calc(var(--cw)*1.42);flex:none;border:2px solid #5b676b;border-radius:6px;background:linear-gradient(#222b29,#0b0f0e);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:10px;color:var(--m);padding:2px}
.pile b{font-size:20px;color:var(--tx)}
.card{position:relative;width:var(--cw);height:calc(var(--cw)*1.42);border:2px solid #8d979a;border-radius:6px;background:linear-gradient(135deg,#b08a2a,#4a3a10 45%,#8a6a1e);display:flex;gap:2px;padding:2px;font-size:calc(var(--cw)*.1);line-height:1.1;flex:none;cursor:pointer;transition:transform .12s;overflow:hidden}
.card.m{border-color:var(--g)}.card.e{border-color:#ff3b3b}
.lc{width:28%;display:flex;flex-direction:column;align-items:center;gap:calc(var(--cw)*.03);padding:2px 1px;background:linear-gradient(#4b5558,#1c2224);border-radius:3px;min-width:0}
.sk{font-size:calc(var(--cw)*.2);line-height:1}
.sv{width:100%;text-align:center;font:700 calc(var(--cw)*.17)/1 system-ui;background:#0b0e0f;border-radius:2px;padding:1px 0}
.sv small{display:block;font-size:.42em;color:#9aa5a8}
.sv.g{color:var(--g);text-shadow:0 0 4px var(--g)}.sv.r{color:#ff3b3b}.sv.y{color:#ffd23f}
.no{margin-top:auto;font:700 calc(var(--cw)*.1) system-ui;color:#d4af37}
.rc{width:72%;display:flex;flex-direction:column;gap:2px;min-width:0}
.fc{font:700 calc(var(--cw)*.07)/1.1 system-ui;text-align:right;color:#f1e9c9;text-transform:uppercase;background:#0b0e0f;padding:2px 3px;border-radius:2px;white-space:nowrap;overflow:hidden}
.fr{flex:1;min-height:0;border:2px solid #c1121f;outline:1px solid #d4af37;border-radius:2px;overflow:hidden;background:#0a0d0b}
.fr img,.fr svg{width:100%;height:100%;object-fit:cover;display:block}
.nm{font:400 calc(var(--cw)*.115)/1 Bangers,Impact,sans-serif;text-transform:uppercase;text-align:center;color:#fff;-webkit-text-stroke:calc(var(--cw)*.012) #000;paint-order:stroke fill;text-shadow:1px 1px 0 #000;min-height:2em;display:grid;place-items:center;overflow:hidden}
.zoom{--cw:190px;display:flex;justify-content:center}
.fx{margin-top:8px;padding:8px;border:1px solid #5b676b;border-radius:6px;background:#0b100e}.fx p{margin:4px 0 0}
.bd{position:absolute;right:3px;top:3px;font-size:1.3em;z-index:3}
select,textarea{background:#0b100e;color:var(--tx);border:1px solid #2a3a30;border-radius:5px;padding:6px;font:inherit;width:100%}
.ov>div.mgr{max-width:600px;width:calc(100% - 24px);max-height:90vh;overflow:auto;text-align:left}
.back{background:url("cartas/back.jpg") center/cover no-repeat;border-color:#7c3aed;cursor:default}
.hand .card:hover{transform:translateY(-8px)}
.card.sel{transform:translateY(-12px);box-shadow:0 0 14px 3px #fff}
.card.dim{opacity:.55}
.meter{display:flex;gap:2px;margin:4px 0}
.meter i{flex:1;height:22px;border-radius:3px;background:#1a211e;font:10px/22px system-ui;text-align:center;color:#6a7a70;font-style:normal}
.meter .n{background:#2a0b0e}.meter .p{background:#0f2a12}
.meter .on{background:var(--g);color:#000;font-weight:700;box-shadow:0 0 10px var(--g)}
.ml{display:flex;justify-content:space-between;font-size:11px;color:var(--m)}
.hp{display:flex;align-items:center;gap:8px;padding:4px 8px;border:1px solid #2a3a30;border-radius:6px;background:#0b100e}
.hp.glow{border-color:var(--g);box-shadow:0 0 10px var(--g);cursor:pointer}
.bar{flex:1;height:10px;background:#2a0b0e;border-radius:5px;overflow:hidden}.bar div{height:100%;background:var(--r);transition:width .3s}
.ctl{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0}
button{font:700 13px system-ui;background:#1d2723;color:var(--tx);border:1px solid var(--g);border-radius:5px;padding:7px 11px;cursor:pointer}
button:focus-visible{outline:2px solid #fff}button:disabled{opacity:.4;cursor:default}button.red{border-color:var(--r)}
.hint{color:#b8c2c6;font-size:12px;flex:1;min-width:150px}
.log{max-height:210px;overflow:auto;font-size:12px}.log div{border-bottom:1px solid #1d2a22;padding:2px 0}
.ov{position:fixed;inset:0;background:#000c;display:grid;place-items:center;z-index:9}
.ov>div{background:#0f1512;border:2px solid var(--g);border-radius:10px;padding:20px;text-align:center;max-width:320px}
.ov h1{font-size:42px}
</style></head>
<body><div id="r"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script>
const {useState,useEffect}=React;
const html=htm.bind(React.createElement);
/* BASE DE DATOS: para ampliarla pega más entradas con este mismo formato.
   key = id interno (único) · number = número oficial (también nombra la imagen ./cartas/NNN.jpg)
   type: personaje | evento | mejora · opcionales: haste (prisa), shield (escudo), demon */
const CARDS_DATABASE=[
{"number":"001","key":"spawn","name":"Spawn","type":"personaje","faction":"Earthly Forces","cost":4,"atk":6,"hp":7,"demon":true,"icon":"💀","effect":"Al entrar, si tu Pila de KO tiene cartas, gana +2 ATK."},
{"number":"002","key":"angela","name":"Angela","type":"personaje","faction":"Heaven","cost":3,"atk":5,"hp":5,"icon":"🪽","effect":"Al atacar a un demonio o personaje de coste 4+, gana +2 ATK en ese combate."},
{"number":"003","key":"violator","name":"Violator","type":"personaje","faction":"Hellspawn","cost":4,"atk":7,"hp":5,"demon":true,"haste":true,"icon":"😈","effect":"Prisa: puede atacar el mismo turno en que entra."},
{"number":"004","key":"clown","name":"Clown","type":"personaje","faction":"Hellspawn","cost":3,"atk":4,"hp":6,"demon":true,"icon":"🤡","effect":"Piel Gruesa: Reduce en 1 el daño de combate que recibe."},
{"number":"005","key":"overtkill","name":"Overtkill","type":"personaje","faction":"Hellspawn","cost":6,"atk":8,"hp":9,"demon":true,"icon":"🦾","effect":"Al entrar, hace 2 de daño a cada personaje enemigo."},
{"number":"015","key":"alsimmons","name":"Al Simmons","type":"personaje","faction":"Earthly Forces","cost":2,"atk":3,"hp":3,"icon":"🕴️","effect":"Evolución: juega Spawn (001) sobre él pagando 2 menos; Spawn conserva su estado de ataque."},
{"number":"041","key":"billy","name":"Billy Kincaid","type":"personaje","faction":"Earthly Forces","cost":2,"atk":4,"hp":2,"haste":true,"icon":"🔪","effect":"Prisa: puede atacar el mismo turno en que entra."},
{"number":"051","key":"fire","name":"Elemental Fire","type":"evento","faction":"Event","cost":3,"icon":"🔥","effect":"5 de daño a un personaje enemigo (no afecta a Angela)."},
{"number":"052","key":"bums","name":"Bums","type":"evento","faction":"Event","cost":1,"icon":"🥫","effect":"Recupera la última carta de tu Pila de KO y ponla en tu mano."},
{"number":"053","key":"cia","name":"C.I.A. Contact","type":"mejora","faction":"Enhancement","cost":2,"icon":"📡","effect":"Equipa a un personaje propio: elige +3 ATK o +4 HP."},
{"number":"054","key":"stasis","name":"Stasis Field","type":"evento","faction":"Event","cost":2,"icon":"❄️","effect":"Congela a un personaje enemigo: no puede atacar en su próximo turno."},
{"number":"070","key":"medieval","name":"Medieval Spawn","type":"personaje","faction":"Hellspawn","cost":5,"atk":7,"hp":8,"demon":true,"shield":true,"icon":"🛡️","effect":"Escudo: reduce en 2 el primer daño que recibe cada turno."},
{"number":"117","key":"cogliostro","name":"Count Cogliostro","type":"personaje","faction":"Earthly Forces","cost":2,"atk":2,"hp":4,"icon":"🧙","effect":"Al entrar: +1 Necroplasma y robas 1 carta."},
{"number":"119","key":"hand","name":"Hand of Malebolgia","type":"personaje","faction":"Hellspawn","cost":7,"atk":9,"hp":10,"demon":true,"haste":true,"icon":"✋","effect":"Prisa: puede atacar el mismo turno en que entra."}
];
const TY={personaje:'c',mejora:'m',evento:'e'},D={},BYNUM={};
CARDS_DATABASE.forEach(k=>{BYNUM[k.number]=k.key;D[k.key]={number:k.number,n:k.name,t:TY[k.type],c:k.cost,a:k.atk,h:k.hp,f:k.faction,x:k.effect,d:k.demon,hs:k.haste,sd:k.shield,i:k.icon}});
const DEF_DECK=["001","001","002","002","003","003","004","004","005","015","041","051","052","053","054","070","070","117","117","119"];
let DECK=null;try{const x=JSON.parse(localStorage.getItem('spawnTcgDeck')||'null');if(Array.isArray(x)&&x.length===20&&x.every(n=>BYNUM[n]))DECK=x}catch(e){}
let IM={};try{IM=JSON.parse(localStorage.getItem('spawnTcgImgs')||'{}')}catch(e){}
const BAD=new Set();
let UID=0;
const mk=id=>({u:++UID,id,atk:D[id].a,hp:D[id].h,mx:D[id].h,rdy:false,fz:false,sh:false});
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const mkSide=s=>({hp:20,deck:shuffle(((s==='p'&&DECK)||DEF_DECK).map(n=>BYNUM[n])),hand:[],f:[null,null,null],ko:[]});
const opp=s=>s==='p'?'e':'p';
const nm=s=>s==='p'?'Tú':'Rival';
const L=(g,t)=>{g.log.unshift(t);if(g.log.length>60)g.log.length=60};
const clamp=v=>Math.max(-10,Math.min(10,v));
function draw(g,s){const S=g[s];if(!S.deck.length){S.hp--;L(g,nm(s)+': mazo vacío, -1 HP.');return}S.hand.push(S.deck.pop())}
function win(g){if(g.over)return;if(g.p.hp<=0)g.over='e';else if(g.e.hp<=0)g.over='p'}
function startTurn(g,s){g.turn=s;g.ph='main';g.ai='main';
 for(const x of['p','e'])g[x].f.forEach(u=>{if(u)u.sh=false});
 g[s].f.forEach(u=>{if(u)u.rdy=!u.fz});
 draw(g,s);L(g,`— Turno ${s==='p'?'tuyo':'del rival'} (Necroplasma: ${s==='p'?g.m:-g.m}) —`);win(g)}
function endTurn(g,s,en){g[s].f.forEach(u=>{if(u)u.fz=false});g.m=clamp(s==='p'?-en:en);startTurn(g,opp(s))}
function newGame(){const g={p:mkSide('p'),e:mkSide('e'),m:3,turn:'p',ph:'main',ai:'main',log:[],over:null};
 for(let i=0;i<4;i++){draw(g,'p');draw(g,'e')}L(g,'¡Empieza la partida! Tienes 3 de Necroplasma.');startTurn(g,'p');return g}
function hit(g,s,i,n){const u=g[s].f[i];if(!u)return;if(D[u.id].sd&&!u.sh){u.sh=true;n=Math.max(0,n-2)}u.hp-=n}
function sweep(g){for(const s of['p','e'])g[s].f.forEach((u,i)=>{if(u&&u.hp<=0){g[s].ko.push(u.id);g[s].f[i]=null;L(g,`${D[u.id].n} (${nm(s)}) cae a la Pila de KO.`)}})}
function tg(g,s,id){const S=g[s],T=g[opp(s)],ix=(F,ok)=>F.map((u,i)=>u&&ok(u)?i:-1).filter(i=>i>=0);
 if(id==='cia')return ix(S.f,()=>1);
 if(id==='fire')return ix(T.f,u=>u.id!=='angela');
 if(id==='stasis')return ix(T.f,()=>1);
 return null}
function can(g,s,id){const t=tg(g,s,id);if(t)return t.length>0;if(D[id].t==='c')return g[s].f.includes(null)||(id==='spawn'&&g[s].f.some(u=>u&&u.id==='alsimmons'));if(id==='bums')return g[s].ko.length>0;return true}
function play(g,s,hi,o){const S=g[s],T=g[opp(s)],id=S.hand[hi],c=D[id];if(!id)return;
 const old=c.t==='c'?S.f[o.slot]:null,ev=id==='spawn'&&old&&old.id==='alsimmons',cost=ev?c.c-2:c.c;
 S.hand.splice(hi,1);g.m=clamp(g.m+(s==='p'?-cost:cost));
 L(g,`${nm(s)} juega ${c.n} (coste ${cost}${ev?', evoluciona a Al Simmons':''}).`);
 if(c.t==='c'){const u=mk(id);if(c.hs||(ev&&old.rdy))u.rdy=true;
  if(id==='spawn'&&S.ko.length){u.atk+=2;L(g,'Spawn gana +2 ATK por la Pila de KO.')}
  S.f[o.slot]=u;
  if(id==='overtkill'){T.f.forEach((_,i)=>hit(g,opp(s),i,2));L(g,'Overtkill: 2 de daño a cada personaje enemigo.')}
  if(id==='cogliostro'){g.m=clamp(g.m+(s==='p'?1:-1));draw(g,s);L(g,'Cogliostro: +1 Necroplasma y roba 1 carta.')}}
 else{
  if(id==='cia'){const u=S.f[o.tg];if(o.md==='atk')u.atk+=3;else{u.hp+=4;u.mx+=4}L(g,`${D[u.id].n} recibe ${o.md==='atk'?'+3 ATK':'+4 HP'}.`)}
  if(id==='fire'){const u=T.f[o.tg];hit(g,opp(s),o.tg,5);L(g,`Elemental Fire quema a ${D[u.id].n}.`)}
  if(id==='bums'&&S.ko.length){const k=S.ko.pop();S.hand.push(k);L(g,`Recupera ${D[k].n} de la Pila de KO.`)}
  if(id==='blast'){T.hp-=3;S.hp-=1;L(g,`Necro-Blast: -3 HP al rival y -1 HP propio (${nm(s)}).`)}
  if(id==='stasis'){T.f[o.tg].fz=true;L(g,`${D[T.f[o.tg].id].n} queda congelado.`)}
  S.ko.push(id)}
 sweep(g);win(g);
 if(!g.over&&((s==='p'&&g.m<0)||(s==='e'&&g.m>0))){L(g,`${nm(s)} cruza el medidor: el turno termina.`);endTurn(g,s,Math.abs(g.m))}}
function attack(g,s,ai,ti){const S=g[s],o=opp(s),T=g[o],a=S.f[ai];if(!a||!a.rdy)return;
 if(ti<0){if(T.f.some(Boolean))return;a.rdy=false;T.hp-=a.atk;L(g,`${D[a.id].n} (${nm(s)}) ataca directo: -${a.atk} HP.`)}
 else{const t=T.f[ti];if(!t)return;a.rdy=false;const d=D[t.id];let av=a.atk;if(a.id==='angela'&&(d.d||d.c>=4))av+=2;
  hit(g,o,ti,av);hit(g,s,ai,t.atk);L(g,`${D[a.id].n} (${nm(s)}) ataca a ${d.n}: ${av} de daño, recibe ${t.atk}.`)}
 sweep(g);win(g)}
function aiOpts(g,s,id){const S=g[s],T=g[opp(s)],t=tg(g,s,id);
 if(D[id].t==='c'){const e=S.f.indexOf(null);return{slot:e>=0?e:S.f.findIndex(u=>u&&u.id==='alsimmons')}}
 if(id==='cia'){const i=t.sort((a,b)=>S.f[b].atk-S.f[a].atk)[0];return{tg:i,md:S.f[i].hp>=5?'atk':'hp'}}
 const sc=i=>(id==='fire'&&T.f[i].hp<=5?100:0)+T.f[i].atk;
 if(t)return{tg:t.sort((a,b)=>sc(b)-sc(a))[0]};
 return{}}
function aiStep(g){const s='e',S=g.e,P=g.p,en=-g.m;
 if(g.ai==='main'){let best=-1,bs=0;
  S.hand.forEach((id,i)=>{const c=D[id];if(c.c>en||!can(g,s,id))return;let sc=c.c*2;
   if(id==='blast')sc=(P.hp<=3||(S.hp>8&&!P.f.some(Boolean)))?20:0;
   if(id==='fire')sc=tg(g,s,id).some(k=>P.f[k].hp<=5)?14:6;
   if(id==='stasis')sc=P.f.some(u=>u&&u.atk>=6)?9:2;
   if(id==='bums')sc=5;
   if(id==='cia')sc=7;
   if(c.t==='c'&&!S.f.some(Boolean))sc+=5;
   if(sc>bs){bs=sc;best=i}});
  if(best>=0){play(g,s,best,aiOpts(g,s,S.hand[best]));return}
  g.ai='combat';return}
 if(g.ai==='combat'){const ai=S.f.findIndex(u=>u&&u.rdy);if(ai<0){g.ai='final';return}
  const a=S.f[ai];
  if(!P.f.some(Boolean)){attack(g,s,ai,-1);return}
  let bi=-1,bsc=0;
  P.f.forEach((t,i)=>{if(!t)return;const d=D[t.id],av=a.atk+(a.id==='angela'&&(d.d||d.c>=4)?2:0);
   const k=av>=t.hp+(D[t.id].sd&&!t.sh?2:0),sv=t.atk<a.hp;if(!k&&!sv)return;
   const sc=(k?3:0)+(sv?2:0)+d.c/10;if(sc>bsc){bsc=sc;bi=i}});
  if(bi<0){a.rdy=false;return}
  attack(g,s,ai,bi);return}
 const i=S.hand.findIndex(id=>D[id].t==='c'&&can(g,s,id)&&D[id].c>en);
 if(i>=0&&Math.random()<.5){play(g,s,i,aiOpts(g,s,S.hand[i]));return}
 L(g,'El rival pasa su turno.');endTurn(g,s,3)}

const Art=({num,icon})=>{const [,f]=useState(0);
 const src=[IM[num],`./cartas/${num}.jpg`,`./cartas/${num}.png`].find(s=>s&&!BAD.has(s));
 return src?html`<img src=${src} alt="" draggable="false" onError=${()=>{BAD.add(src);f(x=>x+1)}}/>`:html`<svg viewBox="0 0 60 80"><rect width="60" height="80" fill="#12090a"/><circle cx="30" cy="36" r="20" fill="none" stroke="#39ff14" stroke-width="2"/><circle cx="30" cy="36" r="15" fill="none" stroke="#c1121f" stroke-width="1"/><text x="30" y="44" text-anchor="middle" font-size="22">${icon}</text><text x="30" y="72" text-anchor="middle" fill="#8a9a9e" font-size="9" font-family="system-ui">${num}</text></svg>`};
const Card=({id,u,cls='',...p})=>{const c=D[id],a=u?u.atk:c.a,h=u?u.hp:c.h,ch=c.t==='c';
 return html`<div className=${'card '+c.t+' '+cls} title=${c.n+': '+c.x} ...${p}>
 <div className="lc"><div className="sk">💀</div><div className="sv g"><small>COSTE</small>${c.c}</div><div className="sv r"><small>ATK</small>${ch?a:'–'}</div><div className="sv y"><small>HP</small>${ch?h:'–'}</div><div className="no">${c.number}</div></div>
 <div className="rc"><div className="fc">${c.f}</div><div className="fr"><${Art} num=${c.number} icon=${c.i}/></div><div className="nm">${c.n}</div></div>
 ${u?html`<div className="bd">${u.fz?'❄️':u.rdy?'⚔️':'💤'}</div>`:null}</div>`};
const Manager=({onClose,onSave,onStart})=>{
 const [num,setNum]=useState(CARDS_DATABASE[0].number),[tx,setTx]=useState((DECK||DEF_DECK).join(', ')),[msg,setMsg]=useState('');
 const arr=tx.split(/[\s,;]+/).filter(Boolean).map(x=>x.padStart(3,'0')),bad=arr.filter(n=>!BYNUM[n]);
 const persist=()=>{try{localStorage.setItem('spawnTcgImgs',JSON.stringify(IM));return true}catch(e){setMsg('No hay espacio en localStorage: usa imágenes más pequeñas o quita otras.');return false}};
 const onFiles=e=>{const fs=[...e.target.files];fs.forEach(f=>{const m=f.name.match(/(\d{3})/),n=fs.length===1?num:(m&&BYNUM[m[1]]?m[1]:null);
  if(!n){setMsg(`"${f.name}": el nombre no tiene un número de carta válido (ej. 001.jpg).`);return}
  const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,360/im.width),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);IM[n]=c.toDataURL('image/jpeg',.82);if(persist())setMsg('Imagen asignada a la carta '+n+'.');onSave()};im.src=r.result};r.readAsDataURL(f)});e.target.value=''};
 const save=go=>{if(arr.length!==20||bad.length){setMsg(bad.length?'Números inválidos: '+bad.join(', '):`El mazo debe tener 20 cartas (tienes ${arr.length}).`);return}
  DECK=arr;try{localStorage.setItem('spawnTcgDeck',JSON.stringify(arr))}catch(e){}setMsg('Mazo guardado: se usa desde la próxima partida.');onSave();if(go)onStart()};
 return html`<div className="ov"><div className="mgr">
 <h2>IMÁGENES POR NÚMERO DE CARTA</h2>
 <p className="hint">Elige una carta y su imagen, o selecciona varios archivos llamados 001.jpg, 002.png… Se guardan en este navegador. En tu HTML exportado también se cargan solas desde ./cartas/NNN.jpg.</p>
 <select value=${num} onChange=${e=>setNum(e.target.value)}>${CARDS_DATABASE.map(k=>html`<option key=${k.number} value=${k.number}>${k.number} · ${k.name}</option>`)}</select>
 <div className="ctl"><input type="file" accept="image/*" multiple onChange=${onFiles}/><button onClick=${()=>{delete IM[num];persist();onSave();setMsg('Imagen quitada de '+num)}}>Quitar imagen ${num}</button></div>
 <h2>TU MAZO (20 CARTAS)</h2>
 <textarea rows="3" value=${tx} onChange=${e=>setTx(e.target.value)}></textarea>
 <div className="hint">${arr.length}/20 cartas${bad.length?' · inválidos: '+bad.join(', '):''}</div>
 <div className="ctl">${CARDS_DATABASE.map(k=>html`<button key=${k.number} title=${k.name} onClick=${()=>setTx(tx.trim().replace(/[,;]$/,'')+(tx.trim()?', ':'')+k.number)}>${k.number}</button>`)}</div>
 <div className="ctl"><button onClick=${()=>setTx(arr.slice(0,-1).join(', '))}>Quitar última</button><button onClick=${()=>setTx(DEF_DECK.join(', '))}>Mazo por defecto</button></div>
 <p className="hint">${msg}</p>
 <div className="ctl"><button onClick=${()=>save(false)}>GUARDAR MAZO</button><button onClick=${()=>save(true)}>GUARDAR Y NUEVA PARTIDA</button><button className="red" onClick=${onClose}>CERRAR</button></div></div></div>`};

function App(){
 const [g,setG]=useState(()=>newGame());
 const [sh,setSh]=useState(null),[su,setSu]=useState(null),[ch,setCh]=useState(null),[zm,setZm]=useState(null),[mg,setMg]=useState(false),[,setVer]=useState(0);
 const upd=f=>setG(o=>{const n=structuredClone(o);f(n);return n});
 const mine=g.turn==='p'&&!g.over;
 useEffect(()=>{if(g.turn!=='e'||g.over)return;const t=setTimeout(()=>upd(aiStep),g.ai==='main'?900:700);return()=>clearTimeout(t)},[g]);
 useEffect(()=>{setSh(null);setSu(null)},[g.turn]);
 const reset=()=>{setG(newGame());setSh(null);setSu(null);setCh(null);setZm(null)};
 const hid=mine&&g.ph==='main'&&sh!=null?g.p.hand[sh]:null;
 const tl=hid?tg(g,'p',hid):null;
 const doPlay=(hi,o)=>{upd(n=>play(n,'p',hi,o));setSh(null);setCh(null)};
 const clickSlot=(s,i)=>{if(!mine)return;
  if(g.ph==='main'){if(!hid)return;const c=D[hid];
   if(c.t==='c'&&s==='p'&&(!g.p.f[i]||(hid==='spawn'&&g.p.f[i].id==='alsimmons')))return doPlay(sh,{slot:i});
   if(hid==='cia'&&s==='p'&&tl.includes(i))return setCh({tg:i});
   if((hid==='fire'||hid==='stasis')&&s==='e'&&tl.includes(i))return doPlay(sh,{tg:i});return}
  const u=g[s].f[i];if(!u)return;
  if(s==='p'){if(u.rdy)setSu(i)}
  else if(su!=null){upd(n=>attack(n,'p',su,i));setSu(null)}};
 const face=()=>{if(mine&&g.ph==='combat'&&su!=null&&!g.e.f.some(Boolean)){upd(n=>attack(n,'p',su,-1));setSu(null)}};
 const Row=s=>{const S=g[s];return html`<div className="row">
  <div className="pile"><span>MAZO</span><b>${S.deck.length}</b></div>
  <div className="pile"><span>PILA KO</span><b>${S.ko.length}</b><span>${S.ko.length?D[S.ko[S.ko.length-1]].n:'vacía'}</span></div>
  ${S.f.map((u,i)=>{let gl='';
   if(hid){const c=D[hid];if(c.t==='c'&&s==='p'&&(!u||(hid==='spawn'&&u.id==='alsimmons')))gl='glow';else if(hid==='cia'&&s==='p'&&tl.includes(i))gl='glow';else if((hid==='fire'||hid==='stasis')&&s==='e'&&tl.includes(i))gl='glow'}
   if(mine&&g.ph==='combat'){if(s==='p'&&u&&u.rdy)gl='rdyc';if(s==='e'&&u&&su!=null)gl='glow';if(s==='p'&&su===i)gl='sel'}
   return html`<div key=${i} className=${'slot '+gl} onClick=${()=>clickSlot(s,i)}>${u?html`<${Card} id=${u.id} u=${u} onPointerEnter=${()=>setZm({id:u.id,u})}/>`:null}</div>`})}</div>`};
 const Hp=s=>{const hp=Math.max(0,g[s].hp),can=s==='e'&&mine&&g.ph==='combat'&&su!=null&&!g.e.f.some(Boolean);
  return html`<div className=${'hp '+(can?'glow':'')} onClick=${s==='e'?face:null}><b>${s==='e'?'RIVAL':'TÚ'}</b><div className="bar"><div style=${{width:hp/20*100+'%'}}></div></div><b>♥ ${hp}</b></div>`};
 const en=g.turn==='p'?g.m:-g.m;
 const needsT=hid&&tl!==null;
 const hint=g.over?'Partida terminada.':g.turn==='e'?'Turno del rival…':g.ph==='main'?(hid?(needsT?'Elige un objetivo resaltado.':'Pulsa JUGAR o elige una zona vacía.'):'Elige una carta de tu mano.'):(su==null?'Elige un personaje con ⚔ y luego su objetivo. Con el campo rival vacío, ataca su HP.':'Elige el objetivo enemigo.');
 return html`<div className="app">
 <div className="side"><div className="pan"><h1>SPAWN TCG</h1>
  <div className="zoom">${zm?html`<${Card} id=${zm.id} u=${zm.u}/>`:null}</div>
  ${zm?html`<div className="fx"><b>${D[zm.id].n}</b> <small>#${D[zm.id].number} · ${D[zm.id].f}</small><p>${D[zm.id].x}</p></div>`:html`<p style=${{color:'#8a9a9e'}}>Pasa el ratón (o toca) una carta para verla en grande.</p>`}
  <h2>HISTORIAL</h2><div className="log">${g.log.map((t,i)=>html`<div key=${i}>${t}</div>`)}</div></div></div>
 <div className="main">
  ${Hp('e')}
  <div className="row">${g.e.hand.map((_,i)=>html`<div key=${i} className="card back" style=${{'--cw':'38px'}}></div>`)}</div>
  ${Row('e')}
  <div className="ml"><span>◀ RIVAL (-10)</span><b style=${{color:'#39ff14'}}>Necroplasma de ${g.turn==='p'?'tu':'su'} turno: ${Math.max(0,en)}</b><span>TÚ (+10) ▶</span></div>
  <div className="meter">${Array.from({length:21},(_,k)=>{const v=k-10;return html`<i key=${k} className=${v===g.m?'on':v<0?'n':v>0?'p':''}>${v===g.m?v:''}</i>`})}</div>
  ${Row('p')}
  <div className="ctl">
   <div className="hint">${hint}</div>
   ${hid&&!needsT&&can(g,'p',hid)?html`<button onClick=${()=>doPlay(sh,D[hid].t==='c'?{slot:g.p.f.indexOf(null)>=0?g.p.f.indexOf(null):g.p.f.findIndex(u=>u&&u.id==='alsimmons')}:{})}>JUGAR</button>`:null}
   <button disabled=${!mine||g.ph!=='main'} onClick=${()=>{upd(n=>{n.ph='combat';L(n,'Fase de combate.')});setSh(null)}}>IR A COMBATE</button>
   <button disabled=${!mine} onClick=${()=>upd(n=>{L(n,'Terminas tu turno.');endTurn(n,'p',3)})}>TERMINAR TURNO</button>
   <button onClick=${()=>setMg(true)}>CARGAR IMÁGENES / MAZOS</button><button className="red" onClick=${reset}>NUEVA PARTIDA</button></div>
  <div className="row hand">${g.p.hand.map((id,i)=>html`<${Card} key=${i} id=${id} cls=${(sh===i?'sel ':'')+(can(g,'p',id)?'':'dim')} onClick=${()=>{setZm({id});if(mine&&g.ph==='main')setSh(sh===i?null:i)}} onPointerEnter=${()=>setZm({id})}/>`)}</div>
  ${Hp('p')}
 </div>
 ${ch?html`<div className="ov"><div><h2>C.I.A. Contact</h2><p>Elige la mejora:</p><div className="ctl" style=${{justifyContent:'center'}}>
  <button onClick=${()=>doPlay(sh,{tg:ch.tg,md:'atk'})}>+3 ATK</button><button onClick=${()=>doPlay(sh,{tg:ch.tg,md:'hp'})}>+4 HP</button><button className="red" onClick=${()=>setCh(null)}>Cancelar</button></div></div></div>`:null}
 ${mg?html`<${Manager} onClose=${()=>setMg(false)} onSave=${()=>setVer(v=>v+1)} onStart=${()=>{setMg(false);reset()}}/>`:null}
 ${g.over?html`<div className="ov"><div><h1>${g.over==='p'?'VICTORIA':'DERROTA'}</h1><p>${g.over==='p'?'El Infierno se queda sin campeón.':'El rival te deja sin HP.'}</p><button onClick=${reset}>NUEVA PARTIDA</button></div></div>`:null}
 </div>`}
ReactDOM.createRoot(document.getElementById('r')).render(html`<${App}/>`);
</script></body></html>
